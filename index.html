<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Edison Bulb — Interactive Light</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════
       CANVAS: menggambar volumetric glow & global illumination
       Dirender di bawah semua elemen agar tidak menutupi UI
  ══════════════════════════════════════════════ -->
  <canvas id="glowCanvas"></canvas>

  <!-- ═══════════════════════════════════════════
       LAMPU WRAPPER — seluruh lampu ada di sini
  ══════════════════════════════════════════════ -->
  <div class="scene">

    <!-- Kabel dan soket -->
    <div class="wire-assembly">
      <div class="wire"></div>
      <div class="socket">
        <div class="socket-band socket-band--top"></div>
        <div class="socket-body"></div>
        <div class="socket-band socket-band--bottom"></div>
      </div>
    </div>

    <!-- Bohlam utama — SVG realistis -->
    <div class="bulb-wrapper">
      <svg id="bulbSVG"
           viewBox="0 0 260 340"
           xmlns="http://www.w3.org/2000/svg"
           aria-label="Lampu pijar Edison">

        <defs>
          <!-- ── Gradien kaca bohlam utama ── -->
          <radialGradient id="glassGrad" cx="38%" cy="28%" r="65%">
            <stop offset="0%"   stop-color="#fff9f0" stop-opacity="0.18" />
            <stop offset="35%"  stop-color="#f5e8c8" stop-opacity="0.07" />
            <stop offset="70%"  stop-color="#c8a96e" stop-opacity="0.04" />
            <stop offset="100%" stop-color="#8b6914" stop-opacity="0.10" />
          </radialGradient>

          <!-- ── Glossy highlight kiri atas ── -->
          <radialGradient id="glossGrad" cx="30%" cy="22%" r="45%">
            <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.40" />
            <stop offset="40%"  stop-color="#ffffff" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.00" />
          </radialGradient>

          <!-- ── Gradient saat lampu menyala: efek panas di dalam kaca ── -->
          <radialGradient id="litGlassGrad" cx="50%" cy="55%" r="55%">
            <stop offset="0%"   stop-color="#ffcc55" stop-opacity="0.00" />
            <stop offset="40%"  stop-color="#ff8c00" stop-opacity="0.00" />
            <stop offset="100%" stop-color="#b85c00" stop-opacity="0.00" />
          </radialGradient>

          <!-- ── Gradien leher bohlam ── -->
          <linearGradient id="neckGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="#8a6a2a" stop-opacity="0.6" />
            <stop offset="30%"  stop-color="#f5dfa0" stop-opacity="0.5" />
            <stop offset="65%"  stop-color="#c8952a" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#6a4e10" stop-opacity="0.6" />
          </linearGradient>

          <!-- ── Filter blur untuk glow filamen di dalam SVG ── -->
          <filter id="filamentGlow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
          </filter>

          <!-- ── Filter glow luar untuk efek halo tipis ── -->
          <filter id="outerHalo" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
          </filter>

          <!-- ── Clip path bentuk bohlam ── -->
          <clipPath id="bulbClip">
            <path d="M130,30
              C85,30 50,68 50,113
              C50,150 68,175 85,200
              C95,215 100,228 100,245
              L160,245
              C160,228 165,215 175,200
              C192,175 210,150 210,113
              C210,68 175,30 130,30 Z" />
          </clipPath>
        </defs>

        <!-- ══════════════════════════════════
             AMBIENT GLOW di sekitar bohlam (canvas menangani ini,
             tapi kita beri lapisan SVG tambahan saat lampu menyala)
        ══════════════════════════════════════ -->
        <ellipse id="svgHaloOuter"
          cx="130" cy="135" rx="115" ry="115"
          fill="none"
          opacity="0" />

        <!-- ══════════════════════════════════
             BOHLAM: bentuk utama (path realistis Edison bulb)
        ══════════════════════════════════════ -->

        <!-- Layer 1: kontur bohlam — isi kaca transparan -->
        <path id="bulbBody"
          d="M130,30
             C85,30 50,68 50,113
             C50,150 68,175 85,200
             C95,215 100,228 100,245
             L160,245
             C160,228 165,215 175,200
             C192,175 210,150 210,113
             C210,68 175,30 130,30 Z"
          fill="url(#glassGrad)"
          stroke="#c8a020"
          stroke-width="1.2"
          stroke-opacity="0.35" />

        <!-- Layer 2: warm glow dalam kaca saat lit -->
        <path id="litGlass"
          d="M130,30
             C85,30 50,68 50,113
             C50,150 68,175 85,200
             C95,215 100,228 100,245
             L160,245
             C160,228 165,215 175,200
             C192,175 210,150 210,113
             C210,68 175,30 130,30 Z"
          fill="url(#litGlassGrad)"
          opacity="0" />

        <!-- ══════════════════════════════════
             INTERNAL STRUCTURE — bagian dalam bohlam
        ══════════════════════════════════════ -->

        <!-- Stem/tiang filamen (glass stem di tengah) -->
        <line x1="130" y1="245" x2="130" y2="185"
          stroke="#d4b870" stroke-width="2" stroke-opacity="0.5" />

        <!-- Penopang kiri filamen -->
        <line x1="130" y1="185" x2="108" y2="165"
          stroke="#c8a020" stroke-width="1.5" stroke-opacity="0.6" />

        <!-- Penopang kanan filamen -->
        <line x1="130" y1="185" x2="152" y2="165"
          stroke="#c8a020" stroke-width="1.5" stroke-opacity="0.6" />

        <!-- ══════════════════════════════════
             FILAMEN — inti lampu pijar
             Dibuat sebagai path berkelok (coil)
        ══════════════════════════════════════ -->
        <g id="filamentGroup" filter="url(#filamentGlow)">

          <!-- Filamen kiri (kelompok spiral/coil) -->
          <path id="filamentLeft"
            d="M108,165
               C106,162 111,158 108,155
               C105,152 111,148 108,145
               C105,142 111,138 108,135
               C105,132 111,128 108,125
               C105,122 111,118 108,115
               C105,112 109,110 108,108"
            stroke="#5a3800"
            stroke-width="2.2"
            stroke-linecap="round"
            fill="none"
            class="filament-wire" />

          <!-- Kabel horizontal penghubung -->
          <path id="filamentBridge"
            d="M108,108 L152,108"
            stroke="#5a3800"
            stroke-width="2.2"
            stroke-linecap="round"
            fill="none"
            class="filament-wire" />

          <!-- Filamen kanan -->
          <path id="filamentRight"
            d="M152,108
               C149,110 153,112 152,115
               C149,118 155,122 152,125
               C149,128 155,132 152,135
               C149,138 155,142 152,145
               C149,148 155,152 152,155
               C149,158 155,162 152,165"
            stroke="#5a3800"
            stroke-width="2.2"
            stroke-linecap="round"
            fill="none"
            class="filament-wire" />

          <!-- Kabel dari penopang ke filamen bawah kiri -->
          <line x1="108" y1="165" x2="108" y2="165"
            stroke="#5a3800" stroke-width="1.8" class="filament-wire" />

          <!-- Kabel dari penopang ke filamen bawah kanan -->
          <line x1="152" y1="165" x2="152" y2="165"
            stroke="#5a3800" stroke-width="1.8" class="filament-wire" />

        </g>

        <!-- ══════════════════════════════════
             GLOSSY REFLECTIONS — kaca tampak nyata
        ══════════════════════════════════════ -->

        <!-- Highlight utama kiri-atas -->
        <ellipse
          cx="90" cy="75" rx="28" ry="45"
          fill="url(#glossGrad)"
          transform="rotate(-20, 90, 75)"
          opacity="0.75" />

        <!-- Highlight sekunder kecil -->
        <ellipse
          cx="80" cy="60" rx="10" ry="18"
          fill="#ffffff"
          opacity="0.22"
          transform="rotate(-15, 80, 60)" />

        <!-- Rim highlight bawah-kanan -->
        <path
          d="M175,190 C185,180 198,165 205,145"
          stroke="#ffffff"
          stroke-width="3"
          stroke-opacity="0.15"
          stroke-linecap="round"
          fill="none" />

        <!-- ══════════════════════════════════
             NECK / LEHER BOHLAM
        ══════════════════════════════════════ -->
        <path
          d="M100,245 L100,255 Q100,265 110,265 L150,265 Q160,265 160,255 L160,245 Z"
          fill="url(#neckGrad)"
          stroke="#9a7420" stroke-width="1" stroke-opacity="0.5" />

        <!-- Detail ulir socket bagian atas -->
        <rect x="102" y="265" width="56" height="5" rx="1"
          fill="#8a6010" fill-opacity="0.7"
          stroke="#c89030" stroke-width="0.5" stroke-opacity="0.4" />

        <!-- Lekukan refleksi leher -->
        <path
          d="M104,250 L104,264"
          stroke="#f0d080" stroke-width="1.5" stroke-opacity="0.3"
          stroke-linecap="round" />
        <path
          d="M155,250 L155,264"
          stroke="#f0d080" stroke-width="1.5" stroke-opacity="0.2"
          stroke-linecap="round" />

      </svg>

      <!-- Efek bloom CSS (layer di luar SVG) -->
      <div id="bloomLayer" class="bloom-layer"></div>
      <div id="bloomLayerOuter" class="bloom-layer bloom-layer--outer"></div>
    </div><!-- end bulb-wrapper -->

    <!-- ══════════════════════════════════
         SAKLAR TOGGLE
    ══════════════════════════════════════ -->
    <div class="switch-container">
      <span class="switch-label" id="switchLabel">OFF</span>
      <button
        id="toggleSwitch"
        class="toggle-switch"
        role="switch"
        aria-checked="false"
        aria-label="Toggle lampu"
        title="Klik untuk nyalakan/matikan lampu">
        <span class="toggle-thumb"></span>
      </button>
    </div>

    <!-- Label kecil di bawah -->
    <p class="hint-text">Klik saklar untuk menyalakan lampu</p>

  </div><!-- end scene -->

  <script src="script.js"></script>
</body>
</html>
