<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
  <title>Edison Bulb</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <canvas id="glowCanvas"></canvas>
  <canvas id="particleCanvas"></canvas>

  <div class="scene">

    <!--
      SATU SVG TUNGGAL: kabel + socket + bohlam — tidak ada gap.
      viewBox 0 0 260 500.
      Atas = kabel, tengah = socket, bawah = globe.
    -->
    <div class="lamp-wrap">
      <svg id="mainSVG" viewBox="0 0 260 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Kaca transparan -->
          <radialGradient id="glassGrad" cx="34%" cy="26%" r="68%">
            <stop offset="0%"   stop-color="#fff9ee" stop-opacity="0.22"/>
            <stop offset="28%"  stop-color="#f0dea0" stop-opacity="0.08"/>
            <stop offset="68%"  stop-color="#c09040" stop-opacity="0.04"/>
            <stop offset="100%" stop-color="#7a5010" stop-opacity="0.12"/>
          </radialGradient>
          <!-- Kaca panas (lit) -->
          <radialGradient id="litGlassGrad" cx="50%" cy="50%" r="55%">
            <stop offset="0%"   stop-color="#ffe898" stop-opacity="0"/>
            <stop offset="40%"  stop-color="#ffaa20" stop-opacity="0"/>
            <stop offset="100%" stop-color="#c05800" stop-opacity="0"/>
          </radialGradient>
          <!-- Gloss kaca -->
          <radialGradient id="glossGrad" cx="26%" cy="20%" r="48%">
            <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.46"/>
            <stop offset="46%"  stop-color="#ffffff" stop-opacity="0.10"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.00"/>
          </radialGradient>
          <!-- Logam kuningan -->
          <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="#2e1c04"/>
            <stop offset="16%"  stop-color="#8a6014"/>
            <stop offset="36%"  stop-color="#d8a038"/>
            <stop offset="50%"  stop-color="#f4cc58"/>
            <stop offset="64%"  stop-color="#d8a038"/>
            <stop offset="84%"  stop-color="#8a6014"/>
            <stop offset="100%" stop-color="#2e1c04"/>
          </linearGradient>
          <!-- Logam gelap (ring) -->
          <linearGradient id="metalDark" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="#140e02"/>
            <stop offset="28%"  stop-color="#5a400c"/>
            <stop offset="50%"  stop-color="#b88828"/>
            <stop offset="72%"  stop-color="#5a400c"/>
            <stop offset="100%" stop-color="#140e02"/>
          </linearGradient>
          <!-- Filter glow filamen -->
          <filter id="filGlow" x="-130%" y="-130%" width="360%" height="360%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
            <feComposite in="SourceGraphic" in2="b" operator="over"/>
          </filter>
        </defs>

        <!-- ══ KABEL Y:0→58 ══ -->
        <line x1="130" y1="0"  x2="130" y2="60"
          stroke="#181008" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="131" y1="2"  x2="131" y2="60"
          stroke="#705020" stroke-width="1" stroke-opacity="0.5" stroke-linecap="round"/>

        <!-- ══ CAP ATAS SOCKET Y:58→72 ══ -->
        <!-- Sambungan kabel ke socket: silinder kecil -->
        <rect x="118" y="58" width="24" height="14" rx="4"
          fill="url(#metalGrad)"/>
        <rect x="118" y="69" width="24" height="3" fill="#000" fill-opacity="0.3"/>

        <!-- ══ SOCKET BAREL Y:72→138 ══
             Lebar simetris 44px (cx=130, half=22) → x:108..152 -->
        <!-- Ring atas -->
        <rect x="106" y="72" width="48" height="10" rx="2.5"
          fill="url(#metalDark)"/>
        <!-- Barel utama -->
        <rect x="106" y="82" width="48" height="46" fill="url(#metalGrad)"/>
        <!-- Ulir -->
        <line x1="106" y1="89"  x2="154" y2="89"  stroke="#000" stroke-opacity="0.22" stroke-width="1.2"/>
        <line x1="106" y1="96"  x2="154" y2="96"  stroke="#000" stroke-opacity="0.22" stroke-width="1.2"/>
        <line x1="106" y1="103" x2="154" y2="103" stroke="#000" stroke-opacity="0.22" stroke-width="1.2"/>
        <line x1="106" y1="110" x2="154" y2="110" stroke="#000" stroke-opacity="0.22" stroke-width="1.2"/>
        <line x1="106" y1="117" x2="154" y2="117" stroke="#000" stroke-opacity="0.22" stroke-width="1.2"/>
        <line x1="106" y1="124" x2="154" y2="124" stroke="#000" stroke-opacity="0.22" stroke-width="1.2"/>
        <!-- Kilap logam vertikal -->
        <rect x="124" y="82" width="12" height="46" fill="#fff" fill-opacity="0.08"/>
        <!-- Ring bawah -->
        <rect x="106" y="128" width="48" height="10" rx="2.5"
          fill="url(#metalDark)"/>

        <!-- ══ NECK / LEHER Y:138→162 ══
             Melebar dari 48px (106..154) ke 62px (99..161) -->
        <path d="M106,138 L99,162 L161,162 L154,138 Z"
          fill="url(#metalGrad)"/>
        <!-- Garis batas bawah neck -->
        <rect x="99" y="160" width="62" height="3"
          fill="url(#metalDark)" rx="1"/>

        <!-- ══ GLOBE BOHLAM Y:162→450 ══
             Menyambung tepat di x:99..161 pada Y=162 -->
        <path id="bulbBody"
          d="M99,162
             C56,162 14,202 14,262
             C14,322 52,368 86,400
             C100,414 108,430 108,446
             L152,446
             C152,430 160,414 174,400
             C208,368 246,322 246,262
             C246,202 204,162 161,162 Z"
          fill="url(#glassGrad)"
          stroke="#c09828" stroke-width="1.3" stroke-opacity="0.40"/>

        <!-- Kaca panas (lit) — dikontrol JS -->
        <path id="litGlass"
          d="M99,162
             C56,162 14,202 14,262
             C14,322 52,368 86,400
             C100,414 108,430 108,446
             L152,446
             C152,430 160,414 174,400
             C208,368 246,322 246,262
             C246,202 204,162 161,162 Z"
          fill="url(#litGlassGrad)" opacity="0"/>

        <!-- ══ STEM INTERNAL Y:446→360 ══ -->
        <line x1="130" y1="446" x2="130" y2="358"
          stroke="#c8b060" stroke-width="2.5" stroke-opacity="0.52"/>
        <line x1="130" y1="358" x2="104" y2="332"
          stroke="#b09040" stroke-width="1.8" stroke-opacity="0.62"/>
        <line x1="130" y1="358" x2="156" y2="332"
          stroke="#b09040" stroke-width="1.8" stroke-opacity="0.62"/>

        <!-- ══ FILAMEN ══ -->
        <g id="filamentGroup" filter="url(#filGlow)">
          <!-- Coil kiri -->
          <path id="filamentLeft"
            d="M104,332 C101,328 108,324 104,320 C100,316 107,312 104,308
               C100,304 107,300 104,296 C101,293 106,290 104,288"
            stroke="#4a2800" stroke-width="2.5"
            stroke-linecap="round" fill="none" class="filament-wire"/>
          <!-- Bridge -->
          <path id="filamentBridge"
            d="M104,288 C112,283 120,281 130,280 C140,281 148,283 156,288"
            stroke="#4a2800" stroke-width="2.5"
            stroke-linecap="round" fill="none" class="filament-wire"/>
          <!-- Coil kanan -->
          <path id="filamentRight"
            d="M156,288 C154,290 159,293 156,296 C153,300 159,304 156,308
               C153,312 159,316 156,320 C153,324 159,328 156,332"
            stroke="#4a2800" stroke-width="2.5"
            stroke-linecap="round" fill="none" class="filament-wire"/>
        </g>

        <!-- ══ REFLEKSI KACA ══ -->
        <ellipse cx="68" cy="215" rx="23" ry="54"
          fill="url(#glossGrad)"
          transform="rotate(-26,68,215)" opacity="0.80"/>
        <ellipse cx="54" cy="194" rx="8" ry="16"
          fill="#ffffff" opacity="0.23"
          transform="rotate(-20,54,194)"/>
        <path d="M212,365 C224,346 236,318 240,286"
          stroke="#ffffff" stroke-width="2.5"
          stroke-opacity="0.11" stroke-linecap="round" fill="none"/>

        <!-- ══ BASE DEKORATIF BAWAH GLOBE ══ -->
        <path d="M108,446 Q108,456 120,458 L140,458 Q152,456 152,446 Z"
          fill="url(#metalGrad)" stroke="#9a7020" stroke-width="0.8" stroke-opacity="0.4"/>

      </svg>

      <!-- Bloom CSS layers -->
      <div id="bloomLayer"      class="bloom-layer"></div>
      <div id="bloomLayerOuter" class="bloom-layer bloom-layer--outer"></div>
    </div><!-- /lamp-wrap -->

    <!-- ══ SAKLAR — posisi fixed, tidak bergeser ══ -->
    <div class="switch-zone">
      <span class="sw-lbl sw-lbl--off">OFF</span>
      <button id="toggleSwitch" class="toggle-switch"
        role="switch" aria-checked="false" aria-label="Toggle lampu">
        <span class="toggle-thumb"></span>
      </button>
      <span class="sw-lbl sw-lbl--on">ON</span>
    </div>

  </div><!-- /scene -->

  <script src="script.js"></script>
</body>
</html>
