<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
  <title>Edison Bulb</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <canvas id="glowCanvas"></canvas>
  <canvas id="particleCanvas"></canvas>

  <div class="scene">
    <div class="lamp-wrap">
      <!--
        SVG ORIENTATION (top→bottom):
          Y=0..55    : kabel
          Y=55..75   : cap pengikat kabel (silinder kecil)
          Y=75..145  : socket barel (ulir Edison)
          Y=145..172 : neck melebar ke bawah
          Y=172..460 : GLOBE besar (dome mengembang ke bawah)
          Y=460..472 : base dekoratif ujung bawah globe

        Globe = bulat besar di BAWAH. Socket = ramping di ATAS.
        Ini orientasi lampu gantung Edison yang benar.
      -->
      <svg id="mainSVG" viewBox="0 0 260 480" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- ── Kaca globe transparan ── -->
          <radialGradient id="glassGrad" cx="32%" cy="28%" r="70%">
            <stop offset="0%"   stop-color="#fffbf2" stop-opacity="0.24"/>
            <stop offset="25%"  stop-color="#f2e4a8" stop-opacity="0.09"/>
            <stop offset="65%"  stop-color="#c09848" stop-opacity="0.04"/>
            <stop offset="100%" stop-color="#7a5210" stop-opacity="0.13"/>
          </radialGradient>

          <!-- ── Kaca hangat saat menyala ── -->
          <radialGradient id="litGrad" cx="50%" cy="46%" r="54%">
            <stop offset="0%"   stop-color="#ffe990" stop-opacity="0"/>
            <stop offset="38%"  stop-color="#ffaa22" stop-opacity="0"/>
            <stop offset="100%" stop-color="#c05a00" stop-opacity="0"/>
          </radialGradient>

          <!-- ── Gloss highlight kaca ── -->
          <radialGradient id="glossGrad" cx="25%" cy="22%" r="46%">
            <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.50"/>
            <stop offset="42%"  stop-color="#ffffff" stop-opacity="0.11"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.00"/>
          </radialGradient>

          <!-- ── Logam kuningan terang ── -->
          <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="#221602"/>
            <stop offset="14%"  stop-color="#7a5610"/>
            <stop offset="34%"  stop-color="#d09c34"/>
            <stop offset="50%"  stop-color="#f0c850"/>
            <stop offset="66%"  stop-color="#d09c34"/>
            <stop offset="86%"  stop-color="#7a5610"/>
            <stop offset="100%" stop-color="#221602"/>
          </linearGradient>

          <!-- ── Logam gelap (ring/band) ── -->
          <linearGradient id="brassdk" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="#0e0a02"/>
            <stop offset="25%"  stop-color="#4e380a"/>
            <stop offset="50%"  stop-color="#aa8224"/>
            <stop offset="75%"  stop-color="#4e380a"/>
            <stop offset="100%" stop-color="#0e0a02"/>
          </linearGradient>

          <!-- ── Glow filter filamen ── -->
          <filter id="filGlow" x="-150%" y="-150%" width="400%" height="400%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
            <feComposite in="SourceGraphic" in2="b" operator="over"/>
          </filter>
        </defs>

        <!-- ════════════════════════════════
             KABEL  (Y 0 → 55)
        ════════════════════════════════ -->
        <line x1="130" y1="0"  x2="130" y2="57"
          stroke="#141008" stroke-width="3" stroke-linecap="round"/>
        <!-- kilap kabel -->
        <line x1="131.5" y1="2" x2="131.5" y2="56"
          stroke="#7a5a1e" stroke-width="1" stroke-opacity="0.45" stroke-linecap="round"/>

        <!-- ════════════════════════════════
             CAP PENGIKAT KABEL  (Y 55 → 72)
             Silinder kecil, lebar 22px
        ════════════════════════════════ -->
        <rect x="119" y="55" width="22" height="17" rx="5"
          fill="url(#brass)"/>
        <!-- shadow bawah cap -->
        <rect x="119" y="69" width="22" height="3" rx="1"
          fill="#000" fill-opacity="0.32"/>

        <!-- ════════════════════════════════
             SOCKET BAREL  (Y 72 → 140)
             Lebar 52px simetris terhadap cx=130
        ════════════════════════════════ -->
        <!-- Ring atas -->
        <rect x="104" y="72" width="52" height="10" rx="3"
          fill="url(#brassdk)"/>
        <!-- Barel utama -->
        <rect x="104" y="82" width="52" height="48" fill="url(#brass)"/>
        <!-- Ulir horizontal -->
        <line x1="104" y1="89"  x2="156" y2="89"  stroke="#000" stroke-opacity="0.20" stroke-width="1.3"/>
        <line x1="104" y1="96"  x2="156" y2="96"  stroke="#000" stroke-opacity="0.20" stroke-width="1.3"/>
        <line x1="104" y1="103" x2="156" y2="103" stroke="#000" stroke-opacity="0.20" stroke-width="1.3"/>
        <line x1="104" y1="110" x2="156" y2="110" stroke="#000" stroke-opacity="0.20" stroke-width="1.3"/>
        <line x1="104" y1="117" x2="156" y2="117" stroke="#000" stroke-opacity="0.20" stroke-width="1.3"/>
        <line x1="104" y1="124" x2="156" y2="124" stroke="#000" stroke-opacity="0.20" stroke-width="1.3"/>
        <!-- Kilap logam vertikal tengah -->
        <rect x="124" y="82" width="12" height="48" fill="#fff" fill-opacity="0.09"/>
        <!-- Ring bawah -->
        <rect x="104" y="130" width="52" height="10" rx="3"
          fill="url(#brassdk)"/>

        <!-- ════════════════════════════════
             NECK (leher melebar) Y 140 → 168
             Socket lebar 52 (x:104..156) → Neck bawah lebar 70 (x:95..165)
        ════════════════════════════════ -->
        <path d="M104,140 L95,168 L165,168 L156,140 Z"
          fill="url(#brass)"/>
        <!-- Band batas bawah neck -->
        <rect x="95" y="165" width="70" height="4"
          fill="url(#brassdk)" rx="1.5"/>

        <!-- ════════════════════════════════
             GLOBE BESAR  (Y 168 → 456)
             Sambung di x:95..165 pada Y=168.
             Globe sangat bulat, lebar max ≈ 230px di Y≈300.
             Ini lampu Edison globe besar.
        ════════════════════════════════ -->
        <path id="bulbBody"
          d="M95,168
             C46,168 8,210 8,272
             C8,340 48,392 84,420
             C100,432 110,446 110,456
             L150,456
             C150,446 160,432 176,420
             C212,392 252,340 252,272
             C252,210 214,168 165,168 Z"
          fill="url(#glassGrad)"
          stroke="#c09828" stroke-width="1.4" stroke-opacity="0.42"/>

        <!-- Layer kaca panas (dikontrol JS) -->
        <path id="litGlass"
          d="M95,168
             C46,168 8,210 8,272
             C8,340 48,392 84,420
             C100,432 110,446 110,456
             L150,456
             C150,446 160,432 176,420
             C212,392 252,340 252,272
             C252,210 214,168 165,168 Z"
          fill="url(#litGrad)" opacity="0"/>

        <!-- ════════════════════════════════
        <!-- ════════════════════════════════
     INTERNAL STRUCTURE (FIXED)
════════════════════════════════ -->
<!-- Stem turun dari socket -->
<line x1="130" y1="168" x2="130" y2="260"
  stroke="#d0bc68"
  stroke-width="2.5"
  stroke-opacity="0.55"/>

<!-- Support kiri -->
<line x1="130" y1="260" x2="102" y2="290"
  stroke="#b89840"
  stroke-width="1.8"
  stroke-opacity="0.65"/>

<!-- Support kanan -->
<line x1="130" y1="260" x2="158" y2="290"
  stroke="#b89840"
  stroke-width="1.8"
  stroke-opacity="0.65"/>

<!-- ════════════════════════════════
     FILAMENT (POSISI BARU)
════════════════════════════════ -->
<g id="filamentGroup" filter="url(#filGlow)">

  <!-- Coil kiri -->
  <path id="filamentLeft"
    d="M102,290
       C99,286 106,282 102,278
       C98,274 105,270 102,266
       C98,262 105,258 102,254
       C99,251 104,248 102,246"
    stroke="#3e2000"
    stroke-width="2.6"
    stroke-linecap="round"
    fill="none"
    class="filament-wire"/>

  <!-- Bridge -->
  <path id="filamentBridge"
    d="M102,246
       C110,241 120,239 130,238
       C140,239 150,241 158,246"
    stroke="#3e2000"
    stroke-width="2.6"
    stroke-linecap="round"
    fill="none"
    class="filament-wire"/>

  <!-- Coil kanan -->
  <path id="filamentRight"
    d="M158,246
       C156,248 161,251 158,254
       C155,258 161,262 158,266
       C155,270 161,274 158,278
       C155,282 161,286 158,290"
    stroke="#3e2000"
    stroke-width="2.6"
    stroke-linecap="round"
    fill="none"
    class="filament-wire"/>

</g>

        <!-- ════════════════════════════════
             REFLEKSI & GLOSS KACA
        ════════════════════════════════ -->
        <!-- Highlight utama kiri-atas -->
        <ellipse cx="62" cy="226" rx="22" ry="56"
          fill="url(#glossGrad)"
          transform="rotate(-28,62,226)" opacity="0.82"/>
        <!-- Highlight kecil -->
        <ellipse cx="48" cy="204" rx="8" ry="15"
          fill="#ffffff" opacity="0.26"
          transform="rotate(-22,48,204)"/>
        <!-- Rim kanan bawah (refleksi tepi) -->
        <path d="M218,380 C232,358 246,326 250,290"
          stroke="#ffffff" stroke-width="2.5"
          stroke-opacity="0.10" stroke-linecap="round" fill="none"/>
        <!-- Glint kecil kanan tengah -->
        <ellipse cx="236" cy="280" rx="5" ry="12"
          fill="#ffffff" opacity="0.10"
          transform="rotate(20,236,280)"/>

        <!-- ════════════════════════════════
             BASE BAWAH GLOBE (dekoratif)
        ════════════════════════════════ -->
        <path d="M110,456 Q110,468 122,470 L138,470 Q150,468 150,456 Z"
          fill="url(#brass)" stroke="#9a7020" stroke-width="0.9" stroke-opacity="0.45"/>
        <!-- Tip ujung bawah -->
        <ellipse cx="130" cy="470" rx="8" ry="4"
          fill="url(#brassdk)"/>

      </svg>

      <!-- CSS Bloom -->
      <div id="bloomLayer"      class="bloom-layer"></div>
      <div id="bloomLayerOuter" class="bloom-layer bloom-layer--outer"></div>
    </div>

    <!-- SAKLAR -->
    <div class="switch-zone">
      <span class="sw-lbl sw-lbl--off">OFF</span>
      <button id="toggleSwitch" class="toggle-switch"
        role="switch" aria-checked="false" aria-label="Toggle lampu">
        <span class="toggle-thumb"></span>
      </button>
      <span class="sw-lbl sw-lbl--on">ON</span>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
